services:
  realtime:
    build:
      context: ./apps/realtime
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./apps/realtime:/app
      - /app/node_modules
    command: npm run dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_REALTIME_URL=http://localhost:3001
      - NEXT_PUBLIC_LIBRETRANSLATE_URL=http://localhost:5000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - realtime
    command: npm run dev
